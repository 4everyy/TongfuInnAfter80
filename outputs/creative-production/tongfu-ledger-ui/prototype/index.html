<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>同福客栈：江湖账本原型</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portrait-overrides.css">
</head>
<body>
  <main class="stage" aria-label="同福客栈横屏游戏界面">
    <section class="scene">
      <header class="scene-head">
        <div><strong>同福客栈</strong><span>大堂 · 午后</span></div>
        <button class="plain-btn" id="soundBtn" aria-label="切换声音">声</button>
      </header>
      <div class="objective"><b>当前目标</b><span>调查镇东陌生来客</span></div>
      <div class="hotspot" id="hotspot"><b>佟掌柜</b><span>可交谈</span></div>
      <div class="npc" aria-label="佟掌柜">
        <img src="assets/xiangyu-explore.png" alt="佟掌柜探索角色">
      </div>
      <div class="player" id="player" aria-label="当前角色白展堂"><span>白</span></div>
      <div class="joystick" id="joystick" aria-label="虚拟摇杆"><i id="stick"></i></div>
      <div class="actions">
        <button id="lightBtn"><span>轻</span><small>轻功</small></button>
        <button id="skillBtn"><span>招</span><small>招式</small></button>
        <button class="primary" id="interactBtn"><span>谈</span><small>交互</small></button>
      </div>
    </section>

    <section class="ledger">
      <nav class="tabs" aria-label="账本导航">
        <button class="active" data-tab="explore">探索</button>
        <button data-tab="party">队伍</button>
        <button data-tab="inn">客栈</button>
        <button data-tab="quest">任务</button>
      </nav>
      <div class="paper">
        <div class="resources"><span>银两 <b>842</b></span><span>食材 <b>126</b></span><span>声望 <b>36</b></span><span>第 <b>3</b> 日</span></div>
        <section class="panel active" data-panel="explore">
          <h2>镇东风声</h2><p class="muted">前往城西码头，打听账簿下落。</p>
          <div class="rule"></div>
          <h3>附近热点</h3><button class="list-row" id="ledgerTalk"><span><b>佟掌柜</b><small>距离 6 步 · 可交谈</small></span><strong>›</strong></button>
          <h3>队伍状态</h3><div class="party-mini"><button class="active"><img src="assets/zhantang-portrait.png" alt="">白展堂<small>气血 104</small></button><button><img src="assets/furong-portrait.png" alt="">郭芙蓉<small>气血 126</small></button><button><img src="assets/xiucai-portrait.png" alt="">吕秀才<small>气血 92</small></button></div>
          <button class="context" id="contextTalk">与佟掌柜交谈</button>
        </section>
        <section class="panel" data-panel="party"><h2>三人小队</h2><p class="muted">点击队员切换当前探索角色。</p><div class="party-list"><button data-role="白"><img src="assets/zhantang-portrait.png" alt="">白展堂<small>轻功 · 点穴</small></button><button data-role="郭"><img src="assets/furong-portrait.png" alt="">郭芙蓉<small>掌力 · 破阵</small></button><button data-role="吕"><img src="assets/xiucai-portrait.png" alt="">吕秀才<small>辩论 · 账目</small></button></div></section>
        <section class="panel" data-panel="inn"><h2>今日经营</h2><div class="income">预计收入 <b>+126 两</b></div><h3>菜单</h3><label><input type="checkbox" checked> 阳春面</label><label><input type="checkbox" checked> 红烧鲤鱼</label><label><input type="checkbox"> 药膳汤</label><button class="context">进入经营</button></section>
        <section class="panel" data-panel="quest"><h2>任务簿</h2><button class="quest active"><b>镇东风声</b><small>主线 · 调查陌生来客</small></button><button class="quest"><b>后院旧木箱</b><small>支线 · 寻找修缮材料</small></button><button class="quest"><b>掌柜的账</b><small>招募 · 声望达到 40</small></button></section>
      </div>
    </section>

    <div class="dialogue" id="dialogue" hidden>
      <img src="assets/xiangyu-portrait.png" alt="佟掌柜头像">
      <div><strong>佟湘玉</strong><p id="dialogueText">展堂，你先别急着往镇东跑。账本上的墨还没干，这事儿不简单。</p><button id="nextDialogue">继续</button></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
